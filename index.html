<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简主页 | 新标签页专用</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Roboto, system-ui, sans-serif;
            background: #f5f7fb;
            height: 100vh;
            overflow: hidden;
            color: #1f2d3d;
        }

        .app {
            display: flex;
            height: 100vh;
            width: 100%;
            background: #fff;
        }

        .sidebar {
            width: 260px;
            background: #f9fafc;
            border-right: 1px solid #e9ecef;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 24px 20px 16px;
            border-bottom: 1px solid #eef2f6;
        }

        .sidebar-header h2 {
            font-size: 1.4rem;
            font-weight: 600;
            background: linear-gradient(135deg, #2c3e66, #1e2f4b);
            background-clip: text;
            -webkit-background-clip: text;
            color: transparent;
        }

        .nav-menu {
            flex: 1;
            padding: 16px 12px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 16px;
            margin-bottom: 4px;
            border-radius: 14px;
            cursor: pointer;
            transition: 0.2s;
            color: #2c3e4e;
            font-weight: 500;
        }

        .nav-item:hover { background: #eef2fa; }
        .nav-item.active { background: #e9eff8; color: #1e5e9c; border-left: 3px solid #3b82f6; font-weight: 600; }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 28px 32px;
            position: relative;
        }

        .toolbar {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 20px;
        }
        .edit-mode-btn {
            background: #f0f4f9;
            border: 1px solid #cddfed;
            padding: 6px 18px;
            border-radius: 40px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: 0.2s;
        }
        .edit-mode-btn.active {
            background: #2c5f8a;
            color: white;
            border-color: #2c5f8a;
        }
        .btn-sm {
            background: white;
            border: 1px solid #dce5ef;
            padding: 6px 16px;
            border-radius: 40px;
            font-size: 0.8rem;
            cursor: pointer;
        }

        .grid-icons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(130px, 160px));
            gap: 20px;
            margin-bottom: 40px;
        }
        .icon-card {
            background: #ffffff;
            border-radius: 20px;
            padding: 16px 8px 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            border: 1px solid #edf2f9;
            box-shadow: 0 2px 6px rgba(0,0,0,0.02);
            position: relative;
        }
        .icon-card:hover { transform: translateY(-2px); box-shadow: 0 12px 20px -12px rgba(0,0,0,0.1); border-color: #cbdff5; }
        .icon-img { width: 56px; height: 56px; margin: 0 auto 10px; display: flex; align-items: center; justify-content: center; }
        .icon-img img { width: 48px; height: 48px; border-radius: 14px; object-fit: contain; background: #f8faff; }
        .icon-title { font-size: 0.85rem; font-weight: 500; word-break: break-word; }
        .icon-url { font-size: 10px; color: #8c9cb0; margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .breadcrumb {
            font-size: 0.85rem;
            color: #5b6f8c;
            margin-bottom: 24px;
            padding-bottom: 12px;
            border-bottom: 1px solid #edf2f7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px;
        }
        .breadcrumb span {
            cursor: pointer;
            transition: color 0.1s;
        }
        .breadcrumb span:hover {
            color: #3b82f6;
            text-decoration: underline;
        }
        .empty-tip { text-align: center; padding: 60px 20px; color: #9aaebf; }

        .context-menu {
            position: fixed;
            background: white;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            padding: 8px 0;
            min-width: 140px;
            z-index: 2000;
            border: 1px solid #e2e8f0;
        }
        .context-menu div {
            padding: 10px 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.1s;
        }
        .context-menu div:hover { background: #eff3f8; }

        .modal {
            display: none;
            position: fixed;
            top:0;left:0;
            width:100%;height:100%;
            background: rgba(0,0,0,0.4);
            align-items: center;
            justify-content: center;
            z-index: 3000;
        }
        .modal-content {
            background: white;
            border-radius: 32px;
            padding: 28px;
            width: 460px;
            max-width: 90%;
        }
        .modal-content input {
            width: 100%;
            padding: 10px 12px;
            margin: 12px 0;
            border: 1px solid #cfdfed;
            border-radius: 28px;
        }
        .modal-buttons { display: flex; justify-content: flex-end; gap: 12px; margin-top: 20px; }
        .btn-primary { background: #2c5f8a; color: white; border: none; padding: 8px 20px; border-radius: 40px; cursor: pointer; }
    </style>
</head>
<body>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-header">
            <h2>📚 极简主页</h2>
        </div>
        <div class="nav-menu" id="navMenu"></div>
        <div style="padding: 16px; border-top: 1px solid #edf2f7;">
            <button class="btn-sm" id="importBookmarkBtn" style="width:100%; margin-bottom:8px;">📂 导入书签 HTML</button>
            <button class="btn-sm" id="exportBookmarkBtn" style="width:100%">📤 导出书签 HTML</button>
        </div>
    </div>
    <div class="main-content">
        <div class="toolbar">
            <button id="editModeToggleBtn" class="edit-mode-btn">✏️ 编辑模式</button>
        </div>
        <div id="dynamicArea"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <h3 id="editModalTitle">编辑书签</h3>
        <input type="text" id="editName" placeholder="名称" />
        <input type="url" id="editUrl" placeholder="链接地址 (URL)" />
        <div class="modal-buttons">
            <button id="editModalCancel" class="btn-sm">取消</button>
            <button id="editModalConfirm" class="btn-primary">保存</button>
        </div>
    </div>
</div>

<script>
    // 存储KEY
    const STORAGE_BOOKMARKS = "local_home_bookmarks_tree_v11";
    const STORAGE_CLICKS = "local_home_click_stats_v11";

    let bookmarksTree = { id: "root", name: "根目录", type: "folder", children: [] };
    let clickStats = {};
    let editMode = false;
    let selectedRootFolder = null;
    let currentFolder = null;
    let folderStack = [];
    let currentNav = "HOME";   // "HOME" or "FOLDER"

    function genId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function ensureNodeIds(node) {
        if (!node.id) node.id = genId();
        if (node.children && node.children.length) node.children.forEach(child => ensureNodeIds(child));
    }

    function loadData() {
        const savedBookmarks = localStorage.getItem(STORAGE_BOOKMARKS);
        if (savedBookmarks) { try { bookmarksTree = JSON.parse(savedBookmarks); } catch(e) {} }
        if (!bookmarksTree.id) ensureNodeIds(bookmarksTree);
        const savedStats = localStorage.getItem(STORAGE_CLICKS);
        if (savedStats) { try { clickStats = JSON.parse(savedStats); } catch(e) {} }
    }
    function persistBookmarks() { localStorage.setItem(STORAGE_BOOKMARKS, JSON.stringify(bookmarksTree)); }
    function persistStats() { localStorage.setItem(STORAGE_CLICKS, JSON.stringify(clickStats)); }
    function persistAll() { persistBookmarks(); persistStats(); }

    function getFaviconUrl(url) {
        try { const domain = new URL(url).hostname; return `https://icons.duckduckgo.com/ip3/${domain}.ico`; } catch(e) { return ''; }
    }
    function handleIconError(img, url) {
        if (img.getAttribute('data-retried')) return;
        img.setAttribute('data-retried', 'true');
        try { const domain = new URL(url).hostname; img.src = `https://www.google.com/s2/favicons?domain=${domain}&sz=64`; } catch(e) { img.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2380a0c0'%3E%3Ccircle cx='12' cy='12' r='10'/%3E%3C/svg%3E"; }
    }

    function recordClick(url, title) {
        if (!url) return;
        if (!clickStats[url]) clickStats[url] = { count: 0, title: title || "未知链接" };
        clickStats[url].count += 1;
        if (title) clickStats[url].title = title;
        persistStats();
        if (currentNav === "HOME") renderHomeView();
    }

    function findNodeById(node, id) {
        if (node.id === id) return node;
        if (node.children) for (let child of node.children) { let found = findNodeById(child, id); if (found) return found; }
        return null;
    }
    function deleteNodeById(parent, id) {
        if (!parent.children) return false;
        const idx = parent.children.findIndex(c => c.id === id);
        if (idx !== -1) { parent.children.splice(idx, 1); return true; }
        for (let child of parent.children) if (deleteNodeById(child, id)) return true;
        return false;
    }
    function updateNodeById(node, id, newName, newUrl) {
        if (node.id === id) {
            if (newName !== undefined) node.name = newName;
            if (newUrl !== undefined && node.type === 'bookmark') node.url = newUrl;
            return true;
        }
        if (node.children) for (let child of node.children) if (updateNodeById(child, id, newName, newUrl)) return true;
        return false;
    }

    function getSidebarRootFolders() {
        const barNames = ["书签栏", "收藏夹栏", "Bookmarks Bar", "Favourites Bar"];
        let barFolder = null;
        for (let name of barNames) {
            barFolder = bookmarksTree.children.find(c => c.type === "folder" && c.name === name);
            if (barFolder) break;
        }
        if (barFolder && barFolder.children) return barFolder.children.filter(c => c.type === "folder");
        return bookmarksTree.children.filter(c => c.type === "folder");
    }

    // 右键菜单
    function showContextMenu(x, y, targetData) {
        removeContextMenu();
        const menuDiv = document.createElement('div'); menuDiv.className = 'context-menu';
        menuDiv.style.left = x + 'px'; menuDiv.style.top = y + 'px';
        const { type, id, url, name } = targetData;
        let editOption = document.createElement('div'); editOption.innerText = '✏️ 编辑';
        editOption.onclick = () => { removeContextMenu(); openEditDialog(targetData); };
        menuDiv.appendChild(editOption);
        let delOption = document.createElement('div'); delOption.innerText = '🗑️ 删除';
        delOption.onclick = () => {
            removeContextMenu();
            if (confirm('确定删除此项？')) {
                if (type === 'bookmark' && id) { deleteNodeById(bookmarksTree, id); persistBookmarks(); }
                else if (type === 'folder' && id) {
                    if (confirm('删除文件夹会删除其内部所有内容，不可撤销')) {
                        deleteNodeById(bookmarksTree, id); persistBookmarks();
                        if (currentFolder && currentFolder.id === id) {
                            if (folderStack.length > 0) { currentFolder = folderStack.pop(); renderCurrentFolder(); }
                            else { goBackToRootFolder(); }
                        }
                        if (selectedRootFolder && selectedRootFolder.id === id) { selectedRootFolder = null; currentFolder = null; folderStack = []; renderHomeView(); }
                    }
                }
                refreshAllAfterEdit();
            }
        };
        menuDiv.appendChild(delOption);
        document.body.appendChild(menuDiv);
        setTimeout(() => {
            document.addEventListener('click', function closeMenu(e) { if (!menuDiv.contains(e.target)) { removeContextMenu(); document.removeEventListener('click', closeMenu); } });
        }, 10);
    }
    function removeContextMenu() { const old = document.querySelector('.context-menu'); if(old) old.remove(); }

    function openEditDialog(data, isNew = false) {
        const modal = document.getElementById('editModal');
        const titleInput = document.getElementById('editName');
        const urlInput = document.getElementById('editUrl');
        if (isNew) {
            document.getElementById('editModalTitle').innerText = '添加书签';
            titleInput.value = ''; urlInput.value = ''; urlInput.style.display = 'block';
        } else {
            document.getElementById('editModalTitle').innerText = (data.type === 'folder') ? '编辑文件夹名称' : '编辑书签';
            titleInput.value = data.name || '';
            if (data.type === 'folder') urlInput.style.display = 'none';
            else { urlInput.style.display = 'block'; urlInput.value = data.url || ''; }
        }
        modal.style.display = 'flex';
        const saveHandler = () => {
            const newName = titleInput.value.trim();
            if (!newName) { alert('名称不能为空'); return; }
            if (isNew) {
                const newUrl = urlInput.value.trim();
                if (!newUrl) { alert('链接地址不能为空'); return; }
                if (currentFolder && currentFolder.type === 'folder') {
                    if (!currentFolder.children) currentFolder.children = [];
                    currentFolder.children.push({ id: genId(), name: newName, url: newUrl, type: "bookmark" });
                    persistBookmarks();
                    if (currentNav === "FOLDER") renderCurrentFolder();
                } else alert('无法添加：当前未处于任何文件夹中');
            } else {
                if (data.type === 'bookmark' && data.id) {
                    const newUrl = urlInput.value.trim();
                    if (!newUrl) { alert('链接地址不能为空'); return; }
                    updateNodeById(bookmarksTree, data.id, newName, newUrl);
                    if (clickStats[data.url]) { clickStats[newUrl] = { count: clickStats[data.url].count, title: newName }; delete clickStats[data.url]; persistStats(); }
                    persistBookmarks();
                } else if (data.type === 'folder' && data.id) {
                    updateNodeById(bookmarksTree, data.id, newName, undefined);
                    persistBookmarks();
                }
            }
            modal.style.display = 'none';
            refreshAllAfterEdit();
            document.getElementById('editModalConfirm').removeEventListener('click', saveHandler);
        };
        const closeModal = () => { modal.style.display = 'none'; document.getElementById('editModalConfirm').removeEventListener('click', saveHandler); };
        document.getElementById('editModalConfirm').onclick = saveHandler;
        document.getElementById('editModalCancel').onclick = closeModal;
        window.onclick = (e) => { if (e.target === modal) closeModal(); };
    }

    function refreshAllAfterEdit() {
        initNavMenu();
        if (currentNav === "HOME") renderHomeView();
        else if (selectedRootFolder && currentFolder) renderCurrentFolder();
        else if (selectedRootFolder) renderCurrentFolder();
        else { currentNav = "HOME"; renderHomeView(); }
        setActiveNavMenu();
    }
    function goBackToRootFolder() {
        if (selectedRootFolder) { currentFolder = selectedRootFolder; folderStack = []; renderCurrentFolder(); }
        else { currentNav = "HOME"; renderHomeView(); }
    }

    function initNavMenu() {
        const navDiv = document.getElementById('navMenu'); navDiv.innerHTML = '';
        const homeItem = document.createElement('div'); homeItem.className = 'nav-item'; homeItem.setAttribute('data-nav', 'HOME');
        homeItem.innerHTML = `<div class="nav-folder-icon">🏠</div><div class="nav-title">首页 · 智能榜</div>`;
        homeItem.onclick = () => { currentNav = "HOME"; selectedRootFolder = null; currentFolder = null; folderStack = []; renderHomeView(); setActiveNavMenu(); };
        navDiv.appendChild(homeItem);
        const folders = getSidebarRootFolders();
        folders.forEach(folder => {
            const folderItem = document.createElement('div'); folderItem.className = 'nav-item';
            folderItem.innerHTML = `<div class="nav-folder-icon">📁</div><div class="nav-title">${escapeHtml(folder.name)}</div>`;
            folderItem.onclick = () => { currentNav = "FOLDER"; selectedRootFolder = folder; currentFolder = folder; folderStack = []; renderCurrentFolder(); setActiveNavMenu(); };
            navDiv.appendChild(folderItem);
        });
        setActiveNavMenu();
    }
    function setActiveNavMenu() {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        if (currentNav === "HOME") document.querySelector('.nav-item[data-nav="HOME"]')?.classList.add('active');
        else if (selectedRootFolder) {
            const items = document.querySelectorAll('.nav-item');
            for (let it of items) if (it.innerText === selectedRootFolder.name && it.querySelector('.nav-folder-icon')?.innerText === '📁') it.classList.add('active');
        }
    }

    function renderCurrentFolder() {
        if (!currentFolder) return;
        const mainDiv = document.getElementById('dynamicArea');
        let breadHtml = `<div class="breadcrumb"><span onclick="goBackToRootFolder()">📁 ${escapeHtml(selectedRootFolder?.name || '根目录')}</span>`;
        for (let f of folderStack) breadHtml += ` > <span data-folder-id="${f.id}">${escapeHtml(f.name)}</span>`;
        breadHtml += `</div>`;
        const folders = currentFolder.children?.filter(c => c.type === "folder") || [];
        const bookmarks = currentFolder.children?.filter(c => c.type === "bookmark") || [];
        let gridHtml = `<div class="grid-icons">`;
        for (let sub of folders) gridHtml += `<div class="icon-card folder-card" data-id="${sub.id}" data-name="${escapeHtml(sub.name)}" data-type="folder"><div class="icon-img"><div style="font-size:48px;">📁</div></div><div class="icon-title">${escapeHtml(sub.name)}</div><div class="icon-url">文件夹</div></div>`;
        for (let bm of bookmarks) {
            const faviconUrl = getFaviconUrl(bm.url);
            gridHtml += `<div class="icon-card bookmark-card" data-id="${bm.id}" data-url="${escapeAttr(bm.url)}" data-name="${escapeAttr(bm.name)}" data-type="bookmark"><div class="icon-img"><img src="${faviconUrl}" onerror="handleIconError(this, '${escapeAttr(bm.url)}')" referrerpolicy="no-referrer" loading="lazy"></div><div class="icon-title">${escapeHtml(bm.name)}</div><div class="icon-url">${bm.url.length > 45 ? bm.url.substring(0,45)+'…' : bm.url}</div></div>`;
        }
        gridHtml += `<div class="icon-card add-bookmark-card" data-type="add"><div class="icon-img"><div style="font-size:48px;color:#8c9cb0;">➕</div></div><div class="icon-title">添加书签</div><div class="icon-url">新增到此文件夹</div></div>`;
        gridHtml += `</div>`;
        mainDiv.innerHTML = breadHtml + gridHtml;

        document.querySelectorAll('.breadcrumb span[data-folder-id]').forEach(span => {
            span.onclick = (e) => {
                const fid = span.getAttribute('data-folder-id');
                const target = findNodeById(bookmarksTree, fid);
                if (target && target.type === 'folder') {
                    let idx = -1;
                    for (let i = 0; i < folderStack.length; i++) if (folderStack[i].id === fid) { idx = i; break; }
                    if (idx !== -1) { folderStack = folderStack.slice(0, idx); currentFolder = target; renderCurrentFolder(); }
                }
                e.stopPropagation();
            };
        });
        document.querySelectorAll('.folder-card').forEach(card => {
            card.onclick = (e) => {
                e.stopPropagation();
                const id = card.getAttribute('data-id');
                const name = card.getAttribute('data-name');
                const target = currentFolder.children.find(c => c.id === id);
                if (target && target.type === 'folder') {
                    if (editMode) { const rect = card.getBoundingClientRect(); showContextMenu(rect.right-130, rect.bottom+5, { type:'folder', id, name }); }
                    else { folderStack.push(currentFolder); currentFolder = target; renderCurrentFolder(); }
                }
            };
        });
        document.querySelectorAll('.bookmark-card').forEach(card => {
            card.onclick = (e) => {
                e.stopPropagation();
                const id = card.getAttribute('data-id');
                const url = card.getAttribute('data-url');
                const name = card.getAttribute('data-name');
                if (editMode) { const rect = card.getBoundingClientRect(); showContextMenu(rect.right-130, rect.bottom+5, { type:'bookmark', id, url, name }); }
                else { if (url) { recordClick(url, name); window.open(url, '_blank'); } }
            };
        });
        document.querySelectorAll('.add-bookmark-card').forEach(card => { card.onclick = (e) => { e.stopPropagation(); openEditDialog(null, true); }; });
    }

    function renderHomeView() {
        const mainDiv = document.getElementById('dynamicArea');
        let allBookmarks = [];
        function collectAll(node) {
            if (node.type === "bookmark" && node.url) allBookmarks.push({ name: node.name, url: node.url, id: node.id });
            else if (node.children) node.children.forEach(collectAll);
        }
        collectAll(bookmarksTree);
        let hotItems = allBookmarks.map(bm => ({ ...bm, count: clickStats[bm.url]?.count || 0 })).sort((a,b) => b.count - a.count).slice(0, 30);
        let hotHtml = `<div><h3>🔥 热门排行 (点击量高 → 低)</h3><div class="grid-icons">`;
        if (hotItems.length === 0) hotHtml += `<div class="empty-tip" style="grid-column:1/-1;">暂无点击记录，点击书签增加热度～</div>`;
        else {
            for (let item of hotItems) {
                const faviconUrl = getFaviconUrl(item.url);
                hotHtml += `<div class="icon-card hot-card" data-id="${item.id}" data-url="${escapeAttr(item.url)}" data-title="${escapeAttr(item.name)}" data-type="bookmark"><div class="icon-img"><img src="${faviconUrl}" onerror="handleIconError(this, '${escapeAttr(item.url)}')" referrerpolicy="no-referrer" loading="lazy"></div><div class="icon-title">${escapeHtml(item.name)}</div><div class="icon-url">⭐ 热度 ${item.count}</div></div>`;
            }
        }
        hotHtml += `</div></div>`;
        mainDiv.innerHTML = hotHtml;
        document.querySelectorAll('.hot-card').forEach(card => {
            card.onclick = (e) => {
                e.stopPropagation();
                const id = card.getAttribute('data-id');
                const url = card.getAttribute('data-url');
                const title = card.getAttribute('data-title');
                if (editMode) { const rect = card.getBoundingClientRect(); showContextMenu(rect.right-130, rect.bottom+5, { type:'bookmark', id, url, name: title }); }
                else { if (url) { recordClick(url, title); window.open(url, '_blank'); } }
            };
        });
    }

    // 导入导出
    function parseBookmarkHTML(htmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const rootDL = doc.querySelector('DL');
        if (!rootDL) throw new Error("无效书签文件");
        function walkNodes(parentNode, currentFolderObj) {
            let children = Array.from(parentNode.children).filter(el => el.tagName === 'DT');
            for (let dt of children) {
                const h3 = dt.querySelector('H3');
                const anchor = dt.querySelector('A');
                if (h3) {
                    let folder = { id: genId(), name: h3.textContent.trim(), type: "folder", children: [] };
                    currentFolderObj.children.push(folder);
                    let nextDL = dt.querySelector('DL');
                    if (nextDL) walkNodes(nextDL, folder);
                } else if (anchor) {
                    let link = { id: genId(), name: anchor.textContent.trim(), url: anchor.getAttribute('HREF'), type: "bookmark" };
                    if (link.url && link.name) currentFolderObj.children.push(link);
                }
            }
        }
        let newRoot = { id: genId(), name: "根目录", type: "folder", children: [] };
        walkNodes(rootDL, newRoot);
        return newRoot;
    }
    function mergeTree(target, source) {
        for (let srcChild of source.children) {
            let existIdx = target.children.findIndex(c => c.name === srcChild.name && c.type === srcChild.type);
            if (existIdx !== -1) {
                if (srcChild.type === "folder" && target.children[existIdx].type === "folder") mergeTree(target.children[existIdx], srcChild);
                else if (srcChild.type === "bookmark") target.children[existIdx] = srcChild;
            } else target.children.push(JSON.parse(JSON.stringify(srcChild)));
        }
    }
    async function importBookmarksFromFile(file) {
        const text = await file.text();
        const parsed = parseBookmarkHTML(text);
        mergeTree(bookmarksTree, parsed);
        persistBookmarks();
        initNavMenu();
        const rootFolders = getSidebarRootFolders();
        if (rootFolders.length > 0 && currentNav !== "HOME") { selectedRootFolder = rootFolders[0]; currentFolder = selectedRootFolder; folderStack = []; currentNav = "FOLDER"; renderCurrentFolder(); }
        else { currentNav = "HOME"; renderHomeView(); }
        setActiveNavMenu();
        alert("导入合并完成 (增量覆盖)\n左侧导航已识别「书签栏」下的文件夹。");
    }
    function generateBookmarkHTML(node) {
        if (node.type === 'folder') {
            let html = `<DT><H3 ADD_DATE="${Math.floor(Date.now()/1000)}" LAST_MODIFIED="${Math.floor(Date.now()/1000)}">${escapeHtml(node.name)}</H3>\n<DL><p>\n`;
            if (node.children) for (let child of node.children) html += generateBookmarkHTML(child);
            html += `</DL><p>\n`;
            return html;
        } else if (node.type === 'bookmark') {
            return `<DT><A HREF="${escapeAttr(node.url)}" ADD_DATE="${Math.floor(Date.now()/1000)}">${escapeHtml(node.name)}</A>\n`;
        }
        return '';
    }
    function exportAsBookmarkHTML() {
        let htmlContent = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<!-- This is an automatically generated file. It will be read and overwritten. -->\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n`;
        for (let child of bookmarksTree.children) htmlContent += generateBookmarkHTML(child);
        htmlContent += `</DL><p>`;
        const blob = new Blob([htmlContent], { type: 'text/html' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `bookmarks_${new Date().toISOString().slice(0,19).replace(/:/g, '-')}.html`;
        a.click();
        URL.revokeObjectURL(a.href);
    }

    // 初始化时强制进入首页（适用于新标签页打开）
    function forceHomeOnLoad() {
        // 清除任何可能残留的深层导航状态
        selectedRootFolder = null;
        currentFolder = null;
        folderStack = [];
        currentNav = "HOME";
        renderHomeView();
        setActiveNavMenu();
    }

    // 事件绑定
    window.goBackToRootFolder = goBackToRootFolder;
    window.handleIconError = handleIconError;
    document.getElementById('importBookmarkBtn').onclick = () => { let inp = document.createElement('input'); inp.type='file'; inp.accept='.html,.htm'; inp.onchange=async e=>{ if(inp.files[0]) await importBookmarksFromFile(inp.files[0]); }; inp.click(); };
    document.getElementById('exportBookmarkBtn').onclick = () => { exportAsBookmarkHTML(); };
    const editToggleBtn = document.getElementById('editModeToggleBtn');
    editToggleBtn.onclick = () => {
        editMode = !editMode;
        if (editMode) { editToggleBtn.textContent = '✏️ 取消编辑'; editToggleBtn.classList.add('active'); }
        else { editToggleBtn.textContent = '✏️ 编辑模式'; editToggleBtn.classList.remove('active'); }
        removeContextMenu();
    };

    loadData();
    initNavMenu();
    // 强制进入首页（新标签页打开时）
    forceHomeOnLoad();
    // 同时记录当前导航状态为 HOME
    currentNav = "HOME";
    setActiveNavMenu();

    function escapeHtml(str) { if(!str) return ''; return str.replace(/[&<>]/g, function(m){if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m;}); }
    function escapeAttr(str) { return String(str).replace(/&/g, '&amp;').replace(/"/g, '&quot;'); }
</script>
</body>
