<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>极简导航 · 本地书签</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --color-bg: #F2F2F0;
            --color-bg-dark: #0F0F0F;
            --color-surface: #FFFFFF;
            --color-border: rgba(0, 0, 0, 0.08);
            --color-text-primary: #0F0F0F;
            --color-text-secondary: #777775;
            --color-text-muted: #AAAAAA;
            --color-text-on-dark: #F0F0EE;
            --color-hover: rgba(15, 15, 15, 0.05);
            --color-active: rgba(15, 15, 15, 0.09);
            --sidebar-width: 220px;
            --font-body: 'DM Sans', system-ui, sans-serif;
            --font-mono: 'DM Mono', monospace;
            --font-display: 'DM Sans', Helvetica Neue, sans-serif;
            --radius-card: 14px;
            --radius-button: 30px;
            --transition-fast: 0.15s ease;
            --transition-normal: 0.25s ease;
            --transition-slow: 0.4s ease;
            --space-xs: 8px;
            --space-sm: 16px;
            --space-md: 40px;
            --space-lg: 80px;
            --space-xl: 160px;
            --space-page: clamp(24px, 6vw, 100px);
        }

        [data-theme="creative"] {
            --color-bg: #F2F2F0;
            --color-bg-dark: #0F0F0F;
            --color-surface: #FFFFFF;
            --color-border: rgba(0,0,0,0.08);
            --color-text-primary: #0F0F0F;
            --color-text-secondary: #777775;
            --color-text-muted: #AAAAAA;
            --color-text-on-dark: #F0F0EE;
            --color-hover: rgba(0,0,0,0.04);
            --color-active: rgba(0,0,0,0.06);
        }

        [data-theme="developer"] {
            --color-bg: #0A0A0A;
            --color-bg-dark: #000000;
            --color-surface: #111111;
            --color-surface-raised: #1A1A1A;
            --color-border: #222222;
            --color-border-strong: #333333;
            --color-text-primary: #EDEDED;
            --color-text-secondary: #888888;
            --color-text-muted: #555555;
            --color-text-on-dark: #EDEDED;
            --color-hover: rgba(255,255,255,0.06);
            --color-active: rgba(255,255,255,0.1);
            --color-scrollbar: rgba(255,255,255,0.15);
            --color-accent-green: #3DD68C;
            --color-accent-blue: #4D9DE0;
            --color-accent-purple: #9B8CF2;
        }

        [data-theme="editorial"] {
            --color-bg: #FAFAF8;
            --color-bg-dark: #111110;
            --color-surface: #FFFFFF;
            --color-border: #E8E6E0;
            --color-border-strong: #C8C5BC;
            --color-text-primary: #111110;
            --color-text-secondary: #6B6A65;
            --color-text-muted: #A3A19A;
            --color-text-on-dark: #F0EFEB;
            --color-hover: rgba(0,0,0,0.03);
            --color-active: rgba(0,0,0,0.05);
            --color-scrollbar: rgba(0,0,0,0.12);
            --color-accent-warm: #C4502A;
        }

        [data-theme="personal"] {
            --color-bg: #FEFDF9;
            --color-bg-dark: #16150F;
            --color-surface: #FFFFFF;
            --color-surface-tint: #F7F5EF;
            --color-border: #E9E5D9;
            --color-border-strong: #D0CABC;
            --color-text-primary: #1C1A14;
            --color-text-secondary: #74706A;
            --color-text-muted: #ACA89F;
            --color-text-on-dark: #F0EDE4;
            --color-hover: rgba(0,0,0,0.03);
            --color-active: rgba(0,0,0,0.05);
            --color-scrollbar: rgba(0,0,0,0.12);
            --color-accent: #C4502A;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: var(--font-body);
            background: var(--color-bg);
            height: 100vh;
            overflow: hidden;
            color: var(--color-text-primary);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        .app {
            display: flex;
            height: 100%;
            width: 100%;
        }

        .sidebar {
            width: var(--sidebar-width);
            background: rgba(242, 242, 240, 0.85);
            backdrop-filter: blur(12px);
            border-right: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            z-index: 100;
            transition: background var(--transition-normal);
        }

        .sidebar-logo {
            padding: 24px 20px 20px;
            border-bottom: 1px solid var(--color-border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-logo svg {
            width: 28px;
            height: 28px;
            color: var(--color-text-primary);
            transition: transform var(--transition-fast);
            flex-shrink: 0;
        }
        .sidebar-logo:hover svg {
            transform: scale(1.05);
        }
        .sidebar-title {
            font-size: 14px;
            font-weight: 500;
            color: var(--color-text-primary);
            letter-spacing: -0.02em;
        }

        .nav-menu {
            flex: 1;
            padding: var(--space-sm) var(--space-xs);
            overflow-y: auto;
        }
        .nav-menu::-webkit-scrollbar { width: 4px; }
        .nav-menu::-webkit-scrollbar-track { background: transparent; }
        .nav-menu::-webkit-scrollbar-thumb { background: var(--color-border); border-radius: 4px; }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            margin-bottom: 4px;
            border-radius: 12px;
            cursor: pointer;
            transition: background var(--transition-fast), color var(--transition-fast);
            color: var(--color-text-secondary);
            font-size: 14px;
            font-weight: 400;
        }
        .nav-item:hover {
            background: var(--color-hover);
            color: var(--color-text-primary);
        }
        .nav-item.active {
            background: var(--color-active);
            color: var(--color-text-primary);
            font-weight: 500;
        }
        .nav-icon {
            width: 24px;
            font-size: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .nav-label {
            font-weight: 450;
        }

        .sidebar-footer {
            padding: var(--space-sm) var(--space-xs);
            border-top: 1px solid var(--color-border);
            display: flex;
            flex-direction: column;
            gap: var(--space-xs);
            position: relative;
        }

        .settings-dropdown {
            position: absolute;
            bottom: calc(100% + 8px);
            left: var(--space-xs);
            right: var(--space-xs);
            background: var(--color-surface);
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            box-shadow: 0 8px 32px rgba(0,0,0,0.12);
            padding: var(--space-xs);
            display: none;
            z-index: 1000;
        }

        .settings-dropdown.active {
            display: block;
        }

        .settings-section {
            margin-bottom: var(--space-xs);
        }

        .settings-section:last-child {
            margin-bottom: 0;
        }

        .settings-section-title {
            font-family: var(--font-mono);
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--color-text-muted);
            padding: 6px 10px;
            margin-bottom: 4px;
        }

        .settings-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            color: var(--color-text-secondary);
            transition: background var(--transition-fast), color var(--transition-fast);
        }

        .settings-item:hover {
            background: var(--color-hover);
            color: var(--color-text-primary);
        }

        .settings-item-icon {
            font-size: 16px;
            width: 20px;
            text-align: center;
        }

        .theme-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            padding: 4px;
        }

        .theme-option {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 10px 8px;
            border-radius: 8px;
            cursor: pointer;
            border: 2px solid transparent;
            transition: all var(--transition-fast);
            font-size: 11px;
        }

        .theme-option:hover {
            background: var(--color-hover);
        }

        .theme-option.active {
            border-color: var(--color-text-primary);
            background: var(--color-active);
        }

        .theme-preview {
            width: 36px;
            height: 36px;
            border-radius: 8px;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .theme-preview-creative {
            background: linear-gradient(135deg, #F2F2F0 50%, #0F0F0F 50%);
        }

        .theme-preview-developer {
            background: linear-gradient(135deg, #0A0A0A 50%, #3DD68C 50%);
        }

        .theme-preview-editorial {
            background: linear-gradient(135deg, #FAFAF8 50%, #C4502A 50%);
        }

        .theme-preview-personal {
            background: linear-gradient(135deg, #FEFDF9 50%, #C4502A 50%);
        }

        .footer-btn {
            background: transparent;
            border: none;
            padding: 8px 12px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 12px;
            cursor: pointer;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--color-text-muted);
            transition: background var(--transition-fast), color var(--transition-fast);
            text-align: left;
        }
        .footer-btn:hover {
            background: var(--color-hover);
            color: var(--color-text-primary);
        }
        .footer-btn.active {
            background: var(--color-active);
            color: var(--color-text-primary);
        }

        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: var(--space-lg) var(--space-page);
            scrollbar-width: thin;
        }
        .main-content::-webkit-scrollbar { width: 6px; }
        .main-content::-webkit-scrollbar-track { background: transparent; }
        .main-content::-webkit-scrollbar-thumb { 
            background: var(--color-border); 
            border-radius: 3px;
            transition: background var(--transition-fast);
        }
        .main-content::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-muted);
        }

        #scrollProgress {
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            height: 3px;
            background: var(--color-text-primary);
            transform-origin: left;
            transform: scaleX(0);
            z-index: 200;
            pointer-events: none;
            transition: transform var(--transition-fast);
        }

        .section-label {
            font-family: var(--font-mono);
            font-size: 11px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: var(--color-text-muted);
            margin-bottom: var(--space-md);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .section-label::after {
            content: '';
            flex: 1;
            height: 1px;
            background: var(--color-border);
        }

        .grid-icons {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: var(--space-sm);
            margin-bottom: var(--space-lg);
        }

        .icon-card {
            background: var(--color-surface);
            border-radius: var(--radius-card);
            padding: 18px 8px 14px;
            text-align: center;
            border: 1px solid var(--color-border);
            transition: transform var(--transition-slow), box-shadow var(--transition-slow);
            cursor: pointer;
            position: relative;
            user-select: none;
            overflow: hidden;
        }
        .icon-card:active { 
            cursor: grabbing; 
            transform: scale(0.98);
        }
        .icon-card.drag-over {
            border: 2px solid var(--color-text-primary);
            background: rgba(15, 15, 15, 0.02);
        }
        .icon-card:hover {
            transform: translateY(-3px) scale(1.01);
            box-shadow: 0 16px 32px -12px rgba(0, 0, 0, 0.15);
        }
        .icon-card::before {
            content: '';
            position: absolute;
            inset: 0;
            background: rgba(15, 15, 15, 0.02);
            opacity: 0;
            transition: opacity var(--transition-normal);
        }
        .icon-card:hover::before {
            opacity: 1;
        }

        .icon-img {
            width: 56px;
            height: 56px;
            margin: 0 auto var(--space-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 1;
        }
        .icon-img img {
            width: 44px;
            height: 44px;
            border-radius: 10px;
            object-fit: contain;
            transition: transform var(--transition-normal);
        }
        .icon-card:hover .icon-img img {
            transform: scale(1.08);
        }
        .folder-emoji { 
            font-size: 40px; 
            transition: transform var(--transition-normal);
        }
        .icon-card:hover .folder-emoji {
            transform: scale(1.08);
        }

        .icon-title {
            font-size: 13px;
            font-weight: 500;
            word-break: break-word;
            line-height: 1.3;
            color: var(--color-text-primary);
            position: relative;
            z-index: 1;
        }
        .icon-meta {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-text-muted);
            margin-top: 6px;
            position: relative;
            z-index: 1;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 6px;
            margin-bottom: var(--space-md);
            font-family: var(--font-mono);
            font-size: 11px;
            color: var(--color-text-muted);
        }
        .breadcrumb span {
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 6px;
            transition: background var(--transition-fast), color var(--transition-fast);
        }
        .breadcrumb span:hover {
            background: var(--color-hover);
            color: var(--color-text-primary);
        }
        .breadcrumb-sep {
            color: var(--color-text-muted);
            padding: 0;
            cursor: default;
        }

        .folder-actions {
            display: flex;
            gap: var(--space-sm);
            margin-bottom: var(--space-md);
        }
        .action-pill {
            background: transparent;
            border: 1px solid var(--color-border);
            padding: 8px 16px;
            border-radius: var(--radius-button);
            font-size: 12px;
            font-family: var(--font-mono);
            color: var(--color-text-secondary);
            cursor: pointer;
            transition: background var(--transition-fast), border-color var(--transition-fast), color var(--transition-fast);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .action-pill:hover {
            background: var(--color-text-primary);
            border-color: var(--color-text-primary);
            color: var(--color-surface);
        }

        .empty-tip {
            grid-column: 1/-1;
            text-align: center;
            padding: var(--space-xl) var(--space-md);
            color: var(--color-text-muted);
            font-family: var(--font-mono);
            font-size: 12px;
        }

        .context-menu {
            position: fixed;
            background: var(--color-surface);
            border-radius: 12px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.12), 0 0 0 1px var(--color-border);
            padding: 6px;
            min-width: 160px;
            z-index: 2000;
            animation: menuFade 0.15s ease;
        }
        @keyframes menuFade {
            from { opacity: 0; transform: scale(0.96) translateY(-4px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        .context-menu-item {
            padding: 10px 14px;
            cursor: pointer;
            font-size: 13px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: background var(--transition-fast);
        }
        .context-menu-item:hover { 
            background: var(--color-hover); 
        }
        .context-menu-item.danger { 
            color: #c0392b;
        }
        .context-menu-item.danger:hover {
            background: rgba(192, 57, 43, 0.08);
        }
        .context-menu-sep {
            height: 1px;
            background: var(--color-border);
            margin: 6px 0;
        }

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(4px);
            align-items: center;
            justify-content: center;
            z-index: 3000;
            animation: modalFadeIn 0.2s ease;
        }
        @keyframes modalFadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        .modal-content {
            background: var(--color-surface);
            border-radius: 24px;
            padding: 32px;
            width: 400px;
            max-width: 90vw;
            box-shadow: 0 24px 48px rgba(0, 0, 0, 0.2);
            animation: modalSlideUp 0.25s ease;
        }
        @keyframes modalSlideUp {
            from { opacity: 0; transform: translateY(12px) scale(0.98); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }
        .modal-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            color: var(--color-text-primary);
        }
        .modal-field-label {
            font-family: var(--font-mono);
            font-size: 10px;
            color: var(--color-text-muted);
            margin: 14px 0 8px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }
        .modal input {
            width: 100%;
            padding: 12px 16px;
            border: 1px solid var(--color-border);
            border-radius: 12px;
            font-family: var(--font-body);
            font-size: 14px;
            background: var(--color-bg);
            transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
            outline: none;
        }
        .modal input:focus {
            border-color: var(--color-text-primary);
            box-shadow: 0 0 0 3px rgba(15, 15, 15, 0.06);
        }
        .modal-buttons {
            display: flex;
            justify-content: flex-end;
            gap: var(--space-sm);
            margin-top: 28px;
        }
        .btn-primary, .btn-secondary {
            padding: 10px 24px;
            border-radius: var(--radius-button);
            font-size: 13px;
            cursor: pointer;
            border: none;
            font-family: var(--font-body);
            font-weight: 500;
            transition: transform var(--transition-fast), box-shadow var(--transition-fast);
        }
        .btn-primary:active, .btn-secondary:active {
            transform: scale(0.98);
        }
        .btn-primary {
            background: var(--color-text-primary);
            color: var(--color-surface);
        }
        .btn-primary:hover {
            box-shadow: 0 4px 12px rgba(15, 15, 15, 0.25);
        }
        .btn-secondary {
            background: transparent;
            border: 1px solid var(--color-border);
            color: var(--color-text-secondary);
        }
        .btn-secondary:hover {
            background: var(--color-hover);
            border-color: var(--color-text-primary);
            color: var(--color-text-primary);
        }
        .delete-choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }
        .delete-choice-btn {
            padding: 14px 16px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            background: transparent;
            text-align: left;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .delete-choice-btn:hover {
            background: var(--color-hover);
            border-color: var(--color-text-primary);
            transform: translateX(4px);
        }

        .import-choices {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
            margin-top: var(--space-md);
        }
        .import-choice-btn {
            padding: 16px 18px;
            border: 1px solid var(--color-border);
            border-radius: var(--radius-card);
            background: var(--color-surface);
            text-align: left;
            cursor: pointer;
            transition: all var(--transition-fast);
        }
        .import-choice-btn:hover {
            background: var(--color-hover);
            border-color: var(--color-text-primary);
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }
    </style>
</head>
<body>
<div id="scrollProgress"></div>
<div class="app">
    <div class="sidebar">
        <div class="sidebar-logo">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="3" width="9" height="9" rx="2" fill="currentColor" opacity="0.9"/>
                <rect x="16" y="3" width="9" height="9" rx="2" fill="currentColor" opacity="0.5"/>
                <rect x="3" y="16" width="9" height="9" rx="2" fill="currentColor" opacity="0.5"/>
                <rect x="16" y="16" width="9" height="9" rx="2" fill="currentColor" opacity="0.2"/>
            </svg>
            <span class="sidebar-title">极简导航</span>
        </div>
        <div class="nav-menu" id="navMenu"></div>
        <div class="sidebar-footer">
            <button class="footer-btn" id="settingsBtn">⚙️ 设置</button>
            <div class="settings-dropdown" id="settingsDropdown">
                <div class="settings-section">
                    <div class="settings-section-title">主题</div>
                    <div class="theme-grid">
                        <div class="theme-option" data-theme="creative">
                            <div class="theme-preview theme-preview-creative"></div>
                            <span>Creative</span>
                        </div>
                        <div class="theme-option" data-theme="developer">
                            <div class="theme-preview theme-preview-developer"></div>
                            <span>Developer</span>
                        </div>
                        <div class="theme-option" data-theme="editorial">
                            <div class="theme-preview theme-preview-editorial"></div>
                            <span>Editorial</span>
                        </div>
                        <div class="theme-option" data-theme="personal">
                            <div class="theme-preview theme-preview-personal"></div>
                            <span>Personal</span>
                        </div>
                    </div>
                </div>
                <div class="settings-section">
                    <div class="settings-section-title">数据</div>
                    <div class="settings-item" id="importMenuItem">
                        <span class="settings-item-icon">�</span>
                        <span>导入书签</span>
                    </div>
                    <div class="settings-item" id="exportMenuItem">
                        <span class="settings-item-icon">💾</span>
                        <span>导出书签</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div class="main-content" id="mainContent">
        <div id="dynamicArea"></div>
    </div>
</div>

<div id="editModal" class="modal">
    <div class="modal-content">
        <div class="modal-title" id="editModalTitle">编辑</div>
        <div class="modal-field-label">名称</div>
        <input type="text" id="editName" />
        <div id="urlFieldGroup">
            <div class="modal-field-label">链接</div>
            <input type="url" id="editUrl" />
        </div>
        <div class="modal-buttons">
            <button class="btn-secondary" id="modalCancel">取消</button>
            <button class="btn-primary" id="modalConfirm">保存</button>
        </div>
    </div>
</div>

<div id="deleteModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">删除文件夹</div>
        <div class="delete-choices">
            <button class="delete-choice-btn" id="deleteFullOption">
                <div style="font-weight:500;">🗑️ 完全删除</div>
                <div style="font-size:12px; color:var(--color-text-muted);">删除文件夹及内部所有书签</div>
            </button>
            <button class="delete-choice-btn" id="deleteEvacuateOption">
                <div style="font-weight:500;">📤 疏散删除</div>
                <div style="font-size:12px; color:var(--color-text-muted);">删除文件夹，书签移至当前层级</div>
            </button>
        </div>
        <div class="modal-buttons" style="margin-top:16px;">
            <button class="btn-secondary" id="deleteModalCancel">取消</button>
        </div>
    </div>
</div>

<div id="importModal" class="modal">
    <div class="modal-content">
        <div class="modal-title">导入书签</div>
        <div style="margin-top: 8px; color: var(--color-text-secondary); font-size: 14px;">选择导入方式</div>
        <div class="import-choices">
            <button class="import-choice-btn" id="browserImportBtn">
                <div style="font-weight:500;">🌐 浏览器书签导入</div>
                <div style="font-size:12px; color:var(--color-text-muted);">直接从浏览器书签收藏夹导入</div>
            </button>
            <button class="import-choice-btn" id="fileImportBtn">
                <div style="font-weight:500;">📁 HTML文件导入</div>
                <div style="font-size:12px; color:var(--color-text-muted);">选择HTML书签文件导入</div>
            </button>
        </div>
        <div class="modal-buttons" style="margin-top:16px;">
            <button class="btn-secondary" id="importModalCancel">取消</button>
        </div>
    </div>
</div>

<script>
    let bookmarksTree = { id: "root", name: "根目录", type: "folder", children: [] };
    let clickStats = {};
    let selectedRootFolder = null;
    let currentFolder = null;
    let folderStack = [];
    let currentNav = "HOME";
    let dragSource = null;

    async function loadDataFromServer() {
        try {
            const res = await fetch('/api/bookmarks');
            const data = await res.json();
            bookmarksTree = data.bookmarksTree || { id: "root", name: "根目录", type: "folder", children: [] };
            clickStats = data.clickStats || {};
        } catch (err) { console.warn(err); }
        if (!bookmarksTree.id) bookmarksTree.id = "root";
        ensureNodeIds(bookmarksTree);
    }
    async function saveDataToServer() {
        await fetch('/api/bookmarks', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ bookmarksTree, clickStats })
        });
    }
    async function persistAndRender() {
        await saveDataToServer();
        if (currentNav === "HOME") await renderHomeView();
        else await renderCurrentFolder();
        initNavMenu();
    }

    function genId() { return Date.now() + '-' + Math.random().toString(36).substr(2, 8); }
    function ensureNodeIds(node) {
        if (!node.id) node.id = genId();
        if (node.children) node.children.forEach(ensureNodeIds);
    }

    function getFaviconUrl(url) {
        try {
            const domain = new URL(url).hostname;
            return `https://www.google.com/s2/favicons?domain=${domain}&sz=64`;
        } catch(e) { return ''; }
    }
    
    const FALLBACK_ICONS = [
        "https://www.google.com/s2/favicons?domain=%DOMAIN%&sz=64",
        "https://t0.gstatic.com/faviconV2?client=NEWS_360&size=64&url=https://%DOMAIN%",
        "https://icons.duckduckgo.com/ip3/%DOMAIN%.ico"
    ];
    
    const PLACEHOLDER_SVG = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='10' fill='%23f8f8f6'/%3E%3Crect x='16' y='16' width='32' height='32' rx='6' fill='%23e8e8e6'/%3E%3C/svg%3E";
    
    const iconCache = new Map();
    const loadingUrls = new Set();
    
    function handleIconError(img, url) {
        const retryCount = parseInt(img.getAttribute('data-retry-count') || '0');
        if (retryCount >= FALLBACK_ICONS.length) {
            img.src = PLACEHOLDER_SVG;
            img.style.filter = 'none';
            return;
        }
        img.setAttribute('data-retry-count', (retryCount + 1).toString());
        try {
            const domain = new URL(url).hostname;
            const fallbackUrl = FALLBACK_ICONS[retryCount].replace('%DOMAIN%', domain);
            img.src = fallbackUrl;
        } catch(e) {
            img.src = PLACEHOLDER_SVG;
            img.style.filter = 'none';
        }
    }
    
    function loadIcon(img, url) {
        if (!url || img.hasAttribute('data-loaded')) return;
        
        const domain = getDomainFromUrl(url);
        if (!domain) {
            img.src = PLACEHOLDER_SVG;
            return;
        }
        
        if (iconCache.has(domain)) {
            img.src = iconCache.get(domain);
            img.setAttribute('data-loaded', 'true');
            return;
        }
        
        if (loadingUrls.has(domain)) return;
        loadingUrls.add(domain);
        
        const faviconUrl = getFaviconUrl(url);
        if (!faviconUrl) {
            img.src = PLACEHOLDER_SVG;
            iconCache.set(domain, PLACEHOLDER_SVG);
            loadingUrls.delete(domain);
            return;
        }
        
        const tempImg = new Image();
        tempImg.onload = function() {
            img.src = tempImg.src;
            img.setAttribute('data-loaded', 'true');
            iconCache.set(domain, tempImg.src);
            loadingUrls.delete(domain);
        };
        tempImg.onerror = function() {
            loadingUrls.delete(domain);
            handleIconErrorWithCache(img, url, domain);
        };
        tempImg.src = faviconUrl;
    }
    
    function getDomainFromUrl(url) {
        try {
            return new URL(url).hostname;
        } catch(e) {
            return null;
        }
    }
    
    function handleIconErrorWithCache(img, url, domain) {
        const retryCount = parseInt(img.getAttribute('data-retry-count') || '0');
        if (retryCount >= FALLBACK_ICONS.length) {
            img.src = PLACEHOLDER_SVG;
            iconCache.set(domain, PLACEHOLDER_SVG);
            return;
        }
        img.setAttribute('data-retry-count', (retryCount + 1).toString());
        try {
            const fallbackUrl = FALLBACK_ICONS[retryCount].replace('%DOMAIN%', domain);
            const tempImg = new Image();
            tempImg.onload = function() {
                img.src = tempImg.src;
                iconCache.set(domain, tempImg.src);
            };
            tempImg.onerror = function() {
                handleIconErrorWithCache(img, url, domain);
            };
            tempImg.src = fallbackUrl;
        } catch(e) {
            img.src = PLACEHOLDER_SVG;
            iconCache.set(domain, PLACEHOLDER_SVG);
        }
    }
    
    function lazyLoadIcons() {
        document.querySelectorAll('.favicon-img').forEach(img => {
            const url = img.getAttribute('data-src');
            if (url && !img.hasAttribute('data-loaded')) {
                loadIcon(img, url);
            }
        });
    }

    function truncateName(name, maxLength = 20) {
        if (!name) return '';
        if (name.length <= maxLength) return name;
        return name.substring(0, maxLength) + '...';
    }

    async function recordClick(url, title) {
        if (!url) return;
        if (!clickStats[url]) clickStats[url] = { count: 0, title: title || '' };
        clickStats[url].count++;
        if (title) clickStats[url].title = title;
        await saveDataToServer();
        if (currentNav === "HOME") renderHomeView();
    }

    function findNodeById(node, id) {
        if (node.id === id) return node;
        if (node.children) for (let c of node.children) { const f = findNodeById(c, id); if (f) return f; }
        return null;
    }
    function findParent(node, childId, parent = null) {
        if (node.id === childId) return parent;
        if (node.children) for (let c of node.children) { const p = findParent(c, childId, node); if (p) return p; }
        return null;
    }
    function deleteNodeById(node, id) {
        if (!node.children) return false;
        const idx = node.children.findIndex(c => c.id === id);
        if (idx !== -1) { node.children.splice(idx, 1); return true; }
        for (let c of node.children) if (deleteNodeById(c, id)) return true;
        return false;
    }
    function moveNode(sourceId, targetParentId, targetIndex = -1) {
        const sourceNode = findNodeById(bookmarksTree, sourceId);
        if (!sourceNode) return false;
        const oldParent = findParent(bookmarksTree, sourceId);
        if (!oldParent) return false;
        const srcIdx = oldParent.children.findIndex(c => c.id === sourceId);
        oldParent.children.splice(srcIdx, 1);
        const newParent = findNodeById(bookmarksTree, targetParentId);
        if (!newParent || newParent.type !== 'folder') return false;
        if (targetIndex === -1 || targetIndex >= newParent.children.length) newParent.children.push(sourceNode);
        else newParent.children.splice(targetIndex, 0, sourceNode);
        return true;
    }
    function evacuateFolder(folderId, parentNode) {
        const folderNode = findNodeById(bookmarksTree, folderId);
        if (!folderNode || folderNode.type !== 'folder') return false;
        const idx = parentNode.children.findIndex(c => c.id === folderId);
        if (idx === -1) return false;
        parentNode.children.splice(idx, 1);
        const insideItems = folderNode.children || [];
        parentNode.children.push(...insideItems);
        return true;
    }
    function updateNodeById(node, id, newName, newUrl) {
        if (node.id === id) {
            if (newName !== undefined) node.name = newName;
            if (newUrl !== undefined && node.type === 'bookmark') node.url = newUrl;
            return true;
        }
        if (node.children) for (let c of node.children) if (updateNodeById(c, id, newName, newUrl)) return true;
        return false;
    }

    function setTheme(theme) {
        const html = document.documentElement;
        const currentTheme = html.getAttribute('data-theme');
        
        if (currentTheme === theme) return;
        
        if (currentTheme) {
            html.removeAttribute('data-theme');
        }
        if (theme !== 'creative') {
            html.setAttribute('data-theme', theme);
        }
        
        localStorage.setItem('bookmarks-theme', theme);
        
        document.querySelectorAll('.theme-option').forEach(option => {
            option.classList.toggle('active', option.dataset.theme === theme);
        });
        
        document.getElementById('settingsDropdown').classList.remove('active');
        document.getElementById('settingsBtn').classList.remove('active');
    }

    function loadTheme() {
        const saved = localStorage.getItem('bookmarks-theme');
        if (saved && saved !== 'creative') {
            document.documentElement.setAttribute('data-theme', saved);
        }
        const currentTheme = saved || 'creative';
        document.querySelectorAll('.theme-option').forEach(option => {
            option.classList.toggle('active', option.dataset.theme === currentTheme);
        });
    }

    function getSidebarRootFolders() {
        const barNames = ["书签栏", "收藏夹栏", "Bookmarks Bar", "Favourites Bar"];
        let bar = null;
        for (let n of barNames) { bar = bookmarksTree.children.find(c => c.type === "folder" && c.name === n); if (bar) break; }
        if (bar?.children) return bar.children.filter(c => c.type === "folder");
        return bookmarksTree.children.filter(c => c.type === "folder");
    }

    let currentContextItem = null;
    function showContextMenu(x, y, item) {
        removeContextMenu();
        currentContextItem = item;
        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';

        const editItem = document.createElement('div');
        editItem.className = 'context-menu-item';
        editItem.innerHTML = '✏️ 编辑';
        editItem.onclick = () => { removeContextMenu(); openEditDialog(item); };
        menu.appendChild(editItem);

        const sep = document.createElement('div'); sep.className = 'context-menu-sep';
        menu.appendChild(sep);

        const delItem = document.createElement('div');
        delItem.className = 'context-menu-item danger';
        delItem.innerHTML = '🗑️ 删除';
        delItem.onclick = async () => {
            removeContextMenu();
            if (item.type === 'folder') {
                showDeleteFolderOptions(item);
            } else {
                if (confirm(`删除书签“${item.name}”?`)) {
                    deleteNodeById(bookmarksTree, item.id);
                    await persistAndRender();
                }
            }
        };
        menu.appendChild(delItem);
        document.body.appendChild(menu);
        setTimeout(() => {
            document.addEventListener('click', function close(e) { if (!menu.contains(e.target)) { removeContextMenu(); document.removeEventListener('click', close); } });
        }, 10);
    }
    function removeContextMenu() { document.querySelector('.context-menu')?.remove(); }

    async function showDeleteFolderOptions(folder) {
        const modal = document.getElementById('deleteModal');
        modal.style.display = 'flex';
        const fullBtn = document.getElementById('deleteFullOption');
        const evacuateBtn = document.getElementById('deleteEvacuateOption');
        const cancelBtn = document.getElementById('deleteModalCancel');
        const close = () => { modal.style.display = 'none'; };
        fullBtn.onclick = async () => {
            close();
            if (confirm(`彻底删除文件夹“${folder.name}”及其中所有内容？`)) {
                deleteNodeById(bookmarksTree, folder.id);
                if (selectedRootFolder?.id === folder.id) { selectedRootFolder = null; currentFolder = null; folderStack = []; currentNav = "HOME"; }
                else if (currentFolder?.id === folder.id) { currentFolder = folderStack.pop() || selectedRootFolder; if (!currentFolder) currentNav = "HOME"; }
                await persistAndRender();
            }
        };
        evacuateBtn.onclick = async () => {
            close();
            const parent = findParent(bookmarksTree, folder.id);
            if (parent) {
                evacuateFolder(folder.id, parent);
                if (selectedRootFolder?.id === folder.id) { selectedRootFolder = null; currentFolder = null; folderStack = []; currentNav = "HOME"; }
                else if (currentFolder?.id === folder.id) { currentFolder = parent; folderStack.pop(); }
                await persistAndRender();
            }
        };
        cancelBtn.onclick = close;
        window.onclick = (e) => { if (e.target === modal) close(); };
    }

    function openEditDialog(item) {
        const modal = document.getElementById('editModal');
        const titleEl = document.getElementById('editModalTitle');
        const nameInput = document.getElementById('editName');
        const urlInput = document.getElementById('editUrl');
        const urlGroup = document.getElementById('urlFieldGroup');
        const isFolder = (item.type === 'folder' || item.type === 'addFolder');
        const isAdd = (item.type === 'add' || item.type === 'addFolder');
        
        const MAX_NAME_LENGTH = 30;
        nameInput.maxLength = MAX_NAME_LENGTH;
        
        if (isAdd) {
            titleEl.innerText = item.type === 'add' ? '添加书签' : '新建文件夹';
            nameInput.value = '';
            urlInput.value = '';
            urlGroup.style.display = item.type === 'add' ? 'block' : 'none';
        } else {
            titleEl.innerText = isFolder ? '编辑文件夹' : '编辑书签';
            nameInput.value = (item.name || '').substring(0, MAX_NAME_LENGTH);
            urlInput.value = item.url || '';
            urlGroup.style.display = isFolder ? 'none' : 'block';
        }
        modal.style.display = 'flex';
        const save = async () => {
            const newName = nameInput.value.trim();
            if (!newName) {
                alert('请输入名称');
                return;
            }
            if (newName.length > MAX_NAME_LENGTH) {
                alert(`名称不能超过${MAX_NAME_LENGTH}个字符`);
                return;
            }
            if (isAdd) {
                if (item.type === 'add' && currentFolder) {
                    const newUrl = urlInput.value.trim();
                    if (!newUrl) {
                        alert('请输入链接');
                        return;
                    }
                    currentFolder.children.push({ id: genId(), name: newName, url: newUrl, type: "bookmark" });
                } else if (item.type === 'addFolder' && currentFolder) {
                    currentFolder.children.push({ id: genId(), name: newName, type: "folder", children: [] });
                }
                await persistAndRender();
            } else {
                if (item.type === 'bookmark') {
                    const newUrl = urlInput.value.trim();
                    if (!newUrl) {
                        alert('请输入链接');
                        return;
                    }
                    updateNodeById(bookmarksTree, item.id, newName, newUrl);
                    if (clickStats[item.url]) { clickStats[newUrl] = { ...clickStats[item.url], title: newName }; delete clickStats[item.url]; }
                } else if (item.type === 'folder') {
                    updateNodeById(bookmarksTree, item.id, newName, undefined);
                }
                await persistAndRender();
            }
            modal.style.display = 'none';
        };
        document.getElementById('modalConfirm').onclick = save;
        document.getElementById('modalCancel').onclick = () => modal.style.display = 'none';
        window.onclick = (e) => { if (e.target === modal) modal.style.display = 'none'; };
    }

    function onDragStart(e, item, parentId, index) {
        dragSource = { type: item.type, id: item.id, parentId, index };
        e.dataTransfer.setData('text/plain', item.id);
        e.dataTransfer.effectAllowed = 'move';
    }
    function onDragOver(e) { e.preventDefault(); e.dataTransfer.dropEffect = 'move'; }
    async function onDrop(e, targetItem, targetParentId, targetIndex, isFolderTarget) {
        e.preventDefault();
        if (!dragSource) return;
        if (dragSource.id === targetItem.id) return;
        let newParentId = targetParentId;
        if (isFolderTarget && targetItem.type === 'folder') newParentId = targetItem.id;
        const success = moveNode(dragSource.id, newParentId, targetIndex);
        if (success) await persistAndRender();
        dragSource = null;
    }

    async function renderHomeView() {
        const area = document.getElementById('dynamicArea');
        let all = [];
        function collect(n) { if (n.type === 'bookmark' && n.url) all.push({ name: n.name, url: n.url, id: n.id }); else if (n.children) n.children.forEach(collect); }
        collect(bookmarksTree);
        const hot = all.map(i => ({ ...i, count: clickStats[i.url]?.count || 0 })).sort((a,b)=>b.count - a.count).slice(0, 30);
        let html = `<div class="section-label">热门 · 按点击排序</div><div class="grid-icons">`;
        if (!hot.length) html += `<div class="empty-tip">暂无书签，请从左侧文件夹添加</div>`;
        for (let i of hot) {
            const truncatedName = truncateName(i.name, 20);
            html += `<div class="icon-card hot-card" draggable="true" data-id="${i.id}" data-url="${escapeAttr(i.url)}" data-name="${escapeAttr(i.name)}">
                <div class="icon-img">
                    <img class="favicon-img" data-src="${escapeAttr(i.url)}" src="${PLACEHOLDER_SVG}">
                </div>
                <div class="icon-title">${escapeHtml(truncatedName)}</div>
            </div>`;
        }
        html += `</div>`;
        area.innerHTML = html;
        document.querySelectorAll('.hot-card').forEach(card => {
            const id = card.dataset.id, url = card.dataset.url, name = card.dataset.name;
            card.ondragstart = (e) => onDragStart(e, { type:'bookmark', id }, null, -1);
            card.ondragover = onDragOver;
            card.ondrop = async (e) => { e.preventDefault(); };
            card.onclick = () => { if(url){ recordClick(url, name); window.open(url,'_blank'); } };
            card.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e.pageX, e.pageY, { type:'bookmark', id, name, url }); return false; };
        });
        lazyLoadIcons();
    }

    async function renderCurrentFolder() {
        if (!currentFolder) return;
        const area = document.getElementById('dynamicArea');
        let bread = `<div class="breadcrumb"><span onclick="goBackToRootFolder()">📁 ${escapeHtml(selectedRootFolder?.name || '根目录')}</span>`;
        for (let f of folderStack) bread += `<span class="breadcrumb-sep">/</span><span data-folder-id="${f.id}">${escapeHtml(f.name)}</span>`;
        bread += `</div>`;
        const actions = `<div class="folder-actions"><div class="action-pill" id="addBookmarkBtn">+ 书签</div><div class="action-pill" id="addFolderBtn">+ 文件夹</div></div>`;
        let grid = `<div class="grid-icons">`;
        const folders = currentFolder.children?.filter(c => c.type === "folder") || [];
        const bookmarks = currentFolder.children?.filter(c => c.type === "bookmark") || [];
        folders.forEach((sub, idx) => {
            grid += `<div class="icon-card folder-card" draggable="true" data-id="${sub.id}" data-name="${escapeAttr(sub.name)}" data-type="folder" data-parent="${currentFolder.id}" data-index="${idx}">
                <div class="icon-img"><div class="folder-emoji">📁</div></div>
                <div class="icon-title">${escapeHtml(sub.name)}</div>
                <div class="icon-meta">${sub.children?.length || 0} 项</div>
            </div>`;
        });
        bookmarks.forEach((bm, idx) => {
            const truncatedName = truncateName(bm.name, 20);
            grid += `<div class="icon-card bookmark-card" draggable="true" data-id="${bm.id}" data-url="${escapeAttr(bm.url)}" data-name="${escapeAttr(bm.name)}" data-parent="${currentFolder.id}" data-index="${idx}">
                <div class="icon-img">
                    <img class="favicon-img" data-src="${escapeAttr(bm.url)}" src="${PLACEHOLDER_SVG}">
                </div>
                <div class="icon-title">${escapeHtml(truncatedName)}</div>
            </div>`;
        });
        grid += `</div>`;
        area.innerHTML = bread + actions + grid;

        function attach(selector, type) {
            document.querySelectorAll(selector).forEach(el => {
                const id = el.dataset.id, name = el.dataset.name, url = el.dataset.url;
                const pId = currentFolder.id;
                const idx = parseInt(el.dataset.index);
                el.ondragstart = (e) => onDragStart(e, { type, id }, pId, idx);
                el.ondragover = onDragOver;
                el.ondrop = async (e) => {
                    e.preventDefault();
                    if (!dragSource) return;
                    let newParent = pId;
                    let finalIndex = idx;
                    if (type === 'folder') newParent = id;
                    if (moveNode(dragSource.id, newParent, finalIndex)) await persistAndRender();
                    dragSource = null;
                };
                el.oncontextmenu = (e) => { e.preventDefault(); showContextMenu(e.pageX, e.pageY, { type, id, name, url }); return false; };
                if (type === 'bookmark') {
                    el.onclick = () => { if (!dragSource) { recordClick(url, name); window.open(url,'_blank'); } };
                } else {
                    el.onclick = (e) => { if (!dragSource && currentFolder) { const target = currentFolder.children.find(c => c.id === id); if (target) { folderStack.push(currentFolder); currentFolder = target; renderCurrentFolder(); } } };
                }
            });
        }
        attach('.folder-card', 'folder');
        attach('.bookmark-card', 'bookmark');
        document.getElementById('addBookmarkBtn').onclick = () => openEditDialog({ type: 'add', name: '', url: '' });
        document.getElementById('addFolderBtn').onclick = () => openEditDialog({ type: 'addFolder', name: '' });
        document.querySelectorAll('.breadcrumb span[data-folder-id]').forEach(span => {
            span.onclick = (e) => {
                const fid = span.dataset.folderId;
                const target = findNodeById(bookmarksTree, fid);
                if (target) {
                    let idx = folderStack.findIndex(f => f.id === fid);
                    if (idx !== -1) { folderStack = folderStack.slice(0, idx); currentFolder = target; renderCurrentFolder(); }
                }
            };
        });
        lazyLoadIcons();
    }

    function goBackToRootFolder() {
        if (selectedRootFolder) { currentFolder = selectedRootFolder; folderStack = []; renderCurrentFolder(); }
        else { currentNav = "HOME"; renderHomeView(); }
    }

    function getFolderIcon(folder) {
        const name = folder.name || '';
        
        if (folder.icon) {
            return folder.icon;
        }
        
        const iconMap = {
            'AI工具': '🤖',
            '产品': '📦',
            '设计': '🎨',
            '工作': '💼',
            '学习': '📚',
            'STUDY': '📚',
            '数据': '📊',
            '报告': '📊',
            '视频': '🎬',
            '影视': '🎬',
            '视频号': '🎥',
            '阅读': '📖',
            '文档': '📄',
            '音乐': '🎵',
            '游戏': '🎮',
            '购物': '🛒',
            '社交': '💬',
            '邮箱': '📧',
            '笔记': '📝',
            '图片': '🖼️',
            '开发': '💻',
            '编程': '💻',
            '代码': '💻',
            '工具': '🔧',
            '资源': '📥',
            '收藏': '⭐',
            '待办': '✅',
            '日历': '📅',
            '财务': '💰',
            '健康': '💪',
            '旅行': '✈️'
        };
        for (const [keyword, icon] of Object.entries(iconMap)) {
            if (name.includes(keyword)) return icon;
        }
        return '⭐';
    }

    function initNavMenu() {
        const nav = document.getElementById('navMenu');
        nav.innerHTML = '';
        const home = document.createElement('div'); home.className = 'nav-item'; home.setAttribute('data-nav','HOME');
        home.innerHTML = `<div class="nav-icon">🔥</div><div class="nav-label">热门排行</div>`;
        home.onclick = () => { currentNav = "HOME"; selectedRootFolder = null; currentFolder = null; folderStack = []; renderHomeView(); setActiveNav(); };
        nav.appendChild(home);
        getSidebarRootFolders().forEach(f => {
            const item = document.createElement('div'); item.className = 'nav-item'; item.setAttribute('data-folder-id', f.id);
            const icon = getFolderIcon(f);
            item.innerHTML = `<div class="nav-icon">${icon}</div><div class="nav-label">${escapeHtml(f.name)}</div>`;
            item.onclick = () => { currentNav = "FOLDER"; selectedRootFolder = f; currentFolder = f; folderStack = []; renderCurrentFolder(); setActiveNav(); };
            item.oncontextmenu = (e) => {
                e.preventDefault();
                showNavContextMenu(e.pageX, e.pageY, f);
                return false;
            };
            nav.appendChild(item);
        });
        setActiveNav();
    }

    let currentNavContextFolder = null;
    function showNavContextMenu(x, y, folder) {
        removeContextMenu();
        currentNavContextFolder = folder;
        
        const menu = document.createElement('div');
        menu.className = 'context-menu';
        menu.style.left = x + 'px';
        menu.style.top = y + 'px';

        const editItem = document.createElement('div');
        editItem.className = 'context-menu-item';
        editItem.innerHTML = '✏️ 编辑';
        editItem.onclick = () => { removeContextMenu(); openNavEditDialog(folder); };
        menu.appendChild(editItem);

        const sep = document.createElement('div'); sep.className = 'context-menu-sep';
        menu.appendChild(sep);

        const delItem = document.createElement('div');
        delItem.className = 'context-menu-item danger';
        delItem.innerHTML = '🗑️ 删除';
        delItem.onclick = async () => {
            removeContextMenu();
            deleteNavFolder(folder);
        };
        menu.appendChild(delItem);
        
        document.body.appendChild(menu);
        setTimeout(() => {
            document.addEventListener('click', function close(e) { 
                if (!menu.contains(e.target)) { 
                    removeContextMenu(); 
                    document.removeEventListener('click', close); 
                } 
            });
        }, 10);
    }

    async function deleteNavFolder(folder) {
        const totalCount = countBookmarks(folder);
        const confirmMsg = totalCount > 0 
            ? `此文件夹包含 ${totalCount} 个书签，确定要删除文件夹及其中所有书签吗？`
            : '确定要删除此文件夹吗？';
        
        if (confirm(confirmMsg)) {
            deleteNodeById(bookmarksTree, folder.id);
            if (selectedRootFolder?.id === folder.id) {
                selectedRootFolder = null;
                currentFolder = null;
                folderStack = [];
                currentNav = "HOME";
            }
            await persistAndRender();
        }
    }

    function countBookmarks(node) {
        let count = 0;
        if (node.type === 'bookmark') return 1;
        if (node.children) {
            node.children.forEach(child => count += countBookmarks(child));
        }
        return count;
    }

    function openNavEditDialog(folder) {
        const modal = document.createElement('div');
        modal.className = 'modal';
        modal.style.display = 'flex';
        
        const content = document.createElement('div');
        content.className = 'modal-content';
        content.innerHTML = `
            <div class="modal-title">编辑文件夹</div>
            <div class="modal-field-label">名称</div>
            <input type="text" id="navEditName" value="${escapeHtml(folder.name)}" maxlength="30" />
            <div class="modal-field-label">图标</div>
            <div id="navEditIconPicker" style="display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px;"></div>
            <div class="modal-buttons">
                <button class="btn-secondary" id="navEditCancel">取消</button>
                <button class="btn-primary" id="navEditConfirm">保存</button>
            </div>
        `;
        
        modal.appendChild(content);
        document.body.appendChild(modal);

        const iconPicker = content.querySelector('#navEditIconPicker');
        const icons = ['📁', '⭐', '🤖', '📦', '🎨', '💼', '📚', '📊', '🎬', '🎥', '📖', '📄', '🎵', '🎮', '🛒', '💬', '📧', '📝', '🖼️', '💻', '🔧', '📥', '✅', '📅', '💰', '💪', '✈️'];
        icons.forEach(icon => {
            const iconBtn = document.createElement('button');
            iconBtn.style.fontSize = '24px';
            iconBtn.style.width = '40px';
            iconBtn.style.height = '40px';
            iconBtn.style.border = folder.icon === icon ? '2px solid var(--color-text-primary)' : '1px solid var(--color-border)';
            iconBtn.style.borderRadius = '8px';
            iconBtn.style.background = 'var(--color-bg)';
            iconBtn.style.cursor = 'pointer';
            iconBtn.style.transition = 'all var(--transition-fast)';
            iconBtn.textContent = icon;
            iconBtn.onclick = () => {
                iconPicker.querySelectorAll('button').forEach(b => b.style.border = '1px solid var(--color-border)');
                iconBtn.style.border = '2px solid var(--color-text-primary)';
                folder.icon = icon;
            };
            iconPicker.appendChild(iconBtn);
        });

        const close = () => { modal.remove(); };
        
        content.querySelector('#navEditConfirm').onclick = async () => {
            const newName = content.querySelector('#navEditName').value.trim();
            if (!newName) {
                alert('请输入名称');
                return;
            }
            folder.name = newName;
            await persistAndRender();
            close();
        };
        
        content.querySelector('#navEditCancel').onclick = close;
        modal.onclick = (e) => { if (e.target === modal) close(); };
    }
    function setActiveNav() {
        document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
        if (currentNav === "HOME") document.querySelector('.nav-item[data-nav="HOME"]')?.classList.add('active');
        else if (selectedRootFolder) document.querySelector(`.nav-item[data-folder-id="${selectedRootFolder.id}"]`)?.classList.add('active');
    }

    function parseBookmarkHTML(html) {
        const doc = new DOMParser().parseFromString(html, 'text/html');
        const dl = doc.querySelector('DL');
        if (!dl) throw new Error('无效书签');
        function walk(dlNode, folder) {
            [...dlNode.children].filter(c=>c.tagName==='DT').forEach(dt => {
                const h3 = dt.querySelector('H3'), a = dt.querySelector('A');
                if (h3) { const sub = { id: genId(), name: h3.textContent.trim(), type: "folder", children: [] }; folder.children.push(sub); const next = dt.querySelector('DL'); if(next) walk(next, sub); }
                else if (a) { folder.children.push({ id: genId(), name: a.textContent.trim(), url: a.getAttribute('HREF'), type: "bookmark" }); }
            });
        }
        const root = { id: genId(), name: "根目录", type: "folder", children: [] };
        walk(dl, root);
        return root;
    }
    function mergeTree(target, source) {
        for (let src of source.children) {
            const idx = target.children.findIndex(c => c.name === src.name && c.type === src.type);
            if (idx !== -1 && src.type === 'folder') mergeTree(target.children[idx], src);
            else target.children.push(JSON.parse(JSON.stringify(src)));
        }
    }
    async function importBookmarks(file) {
        const text = await file.text();
        const parsed = parseBookmarkHTML(text);
        mergeTree(bookmarksTree, parsed);
        await persistAndRender();
        alert('导入完成');
    }

    function showImportOptions() {
        const modal = document.getElementById('importModal');
        modal.style.display = 'flex';
        
        const close = () => { modal.style.display = 'none'; };
        
        document.getElementById('browserImportBtn').onclick = async () => {
            close();
            await importFromBrowserBookmarks();
        };
        
        document.getElementById('fileImportBtn').onclick = () => {
            close();
            const inp = Object.assign(document.createElement('input'), {type:'file', accept:'.html,.htm'});
            inp.onchange = async e => { if(inp.files[0]) await importBookmarks(inp.files[0]); };
            inp.click();
        };
        
        document.getElementById('importModalCancel').onclick = close;
        window.onclick = (e) => { if (e.target === modal) close(); };
    }

    async function importFromBrowserBookmarks() {
        if (typeof browser !== 'undefined' && browser.bookmarks) {
            try {
                const bookmarks = await browser.bookmarks.getTree();
                const root = convertBrowserBookmarks(bookmarks[0]);
                mergeTree(bookmarksTree, root);
                await persistAndRender();
                alert('从浏览器书签导入完成');
            } catch (err) {
                alert('导入失败：' + err.message);
            }
        } else if (typeof chrome !== 'undefined' && chrome.bookmarks) {
            chrome.bookmarks.getTree((bookmarks) => {
                try {
                    const root = convertBrowserBookmarks(bookmarks[0]);
                    mergeTree(bookmarksTree, root);
                    persistAndRender().then(() => {
                        alert('从浏览器书签导入完成');
                    });
                } catch (err) {
                    alert('导入失败：' + err.message);
                }
            });
        } else {
            alert('您的浏览器不支持直接导入书签功能。\n\n请使用HTML文件导入方式，或安装浏览器扩展后重试。');
        }
    }

    function convertBrowserBookmarks(node) {
        const result = {
            id: node.id || genId(),
            name: node.title || '未命名',
            type: node.url ? 'bookmark' : 'folder',
            url: node.url || undefined
        };
        if (node.children && node.children.length > 0) {
            result.type = 'folder';
            result.children = node.children.map(child => convertBrowserBookmarks(child));
        }
        return result;
    }
    function exportBookmarks() {
        function gen(node) {
            if (node.type === 'folder') {
                let s = `<DT><H3>${escapeHtml(node.name)}</H3>\n<DL><p>\n`;
                (node.children||[]).forEach(c => s += gen(c));
                return s + `</DL><p>\n`;
            }
            return `<DT><A HREF="${escapeAttr(node.url)}">${escapeHtml(node.name)}</A>\n`;
        }
        let html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>Bookmarks</TITLE>\n<H1>Bookmarks</H1>\n<DL><p>\n`;
        bookmarksTree.children.forEach(c => html += gen(c));
        html += `</DL><p>`;
        const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(new Blob([html], {type:'text/html'})), download: `bookmarks_${new Date().toISOString().slice(0,10)}.html` });
        a.click(); URL.revokeObjectURL(a.href);
    }

    window.goBackToRootFolder = goBackToRootFolder;
    window.handleIconError = handleIconError;
    
    document.getElementById('settingsBtn').onclick = (e) => {
        e.stopPropagation();
        const dropdown = document.getElementById('settingsDropdown');
        const btn = document.getElementById('settingsBtn');
        const isActive = dropdown.classList.contains('active');
        dropdown.classList.toggle('active');
        btn.classList.toggle('active');
    };
    
    document.getElementById('importMenuItem').onclick = () => {
        document.getElementById('settingsDropdown').classList.remove('active');
        document.getElementById('settingsBtn').classList.remove('active');
        showImportOptions();
    };
    
    document.getElementById('exportMenuItem').onclick = () => {
        document.getElementById('settingsDropdown').classList.remove('active');
        document.getElementById('settingsBtn').classList.remove('active');
        exportBookmarks();
    };
    
    document.querySelectorAll('.theme-option').forEach(option => {
        option.onclick = () => {
            const theme = option.dataset.theme;
            setTheme(theme);
        };
    });
    
    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('settingsDropdown');
        const btn = document.getElementById('settingsBtn');
        if (!dropdown.contains(e.target) && e.target !== btn) {
            dropdown.classList.remove('active');
            btn.classList.remove('active');
        }
    });

    (async () => {
        await loadDataFromServer();
        loadTheme();
        initNavMenu();
        currentNav = "HOME";
        await renderHomeView();
        setActiveNav();
        const main = document.getElementById('mainContent');
        main.addEventListener('scroll', () => {
            const p = main.scrollTop / (main.scrollHeight - main.clientHeight);
            document.getElementById('scrollProgress').style.transform = `scaleX(${isNaN(p) ? 0 : p})`;
        });
    })();

    function escapeHtml(s) { if(!s) return ''; return s.replace(/[&<>]/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[m])); }
    function escapeAttr(s) { return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;'); }
</script>
